<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravecrown — volviendo al juego</title>
  <style>
    body { font-family: sans-serif; background: #140f0c; color: #e8dcc4; padding: 2rem; text-align: center; }
    a { color: #d4b45a; }
    code { word-break: break-all; background: #241c16; padding: 0.4rem; display: block; margin-top: 1rem; text-align: left; }
    .btn { display: inline-block; margin-top: 1.25rem; padding: 0.75rem 1.25rem; background: #d4b45a; color: #140f0c; text-decoration: none; font-weight: 700; border-radius: 6px; }
  </style>
</head>
<body>
  <p>Volviendo a Gravecrown…</p>
  <p>Si el juego no se abre solo, toca el botón o copia el enlace y pégalo en <strong>Cuenta → Pegar sesión</strong>.</p>
  <p><a class="btn" id="open" href="#">Abrir Gravecrown</a></p>
  <code id="link"></code>
  <script>
    // Supabase deja tokens en el hash (#access_token=…). En Android el
    // fragmento a menudo no llega al intent; lo pasamos como query (?…).
    var raw = "";
    if (location.hash && location.hash.length > 1) {
      raw = location.hash.substring(1);
    } else if (location.search && location.search.length > 1) {
      raw = location.search.substring(1);
    }
    var deep = "gravecrown://auth-callback" + (raw ? ("?" + raw) : "");
    // Intent URL: Chrome a veces abre mejor el paquete que el scheme solo.
    var intentUrl = "intent://auth-callback" + (raw ? ("?" + raw) : "")
      + "#Intent;scheme=gravecrown;package=com.gravecrown.game;end";
    var linkEl = document.getElementById("link");
    var openEl = document.getElementById("open");
    linkEl.textContent = deep;
    openEl.href = deep;
    function go() {
      try { location.replace(intentUrl); } catch (e1) {}
      setTimeout(function () {
        try { location.href = deep; } catch (e2) {}
      }, 400);
    }
    if (raw) { go(); }
  </script>
</body>
</html>
